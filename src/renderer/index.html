<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeShot</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-app-region: no-drag; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; -webkit-app-region: no-drag; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Catch any JS errors and log them via Tauri
      window.addEventListener('error', function(e) {
        if (window.__TAURI__) {
          document.title = 'ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        }
      });
    </script>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
