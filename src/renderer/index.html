<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeShot</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
      #debug { position: fixed; top: 10px; left: 10px; color: #0f0; font: 14px monospace; z-index: 99999; pointer-events: none; white-space: pre-wrap; max-width: 80%; }
    </style>
  </head>
  <body>
    <div id="debug"></div>
    <div id="root"></div>
    <script>
      // Catch all errors and show them on screen
      const dbg = document.getElementById('debug');
      function debugLog(msg) { dbg.textContent += msg + '\n'; }
      window.addEventListener('error', (e) => debugLog('ERROR: ' + e.message));
      window.addEventListener('unhandledrejection', (e) => debugLog('REJECT: ' + e.reason));
      window._debugLog = debugLog;
    </script>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
