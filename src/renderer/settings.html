<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeShot Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #020A51 0%, #2322F0 60%, #9F38FA 100%);
      color: #fff; height: 100vh;
      display: flex; flex-direction: column;
      user-select: none; overflow: hidden;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 8px;
    }
    .header h2 {
      font-size: 16px; font-weight: 700;
      background: linear-gradient(90deg, #fff, #2AE3FF);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .close-x {
      background: none; border: none; color: rgba(255,255,255,0.3);
      font-size: 18px; cursor: pointer; transition: color 0.15s;
    }
    .close-x:hover { color: #fff; }
    .content { flex: 1; padding: 0 16px 16px; overflow-y: auto; }
    .section { margin-bottom: 16px; }
    .section-title {
      font-size: 10px; color: rgba(42,227,255,0.7); text-transform: uppercase;
      letter-spacing: 1.5px; margin-bottom: 8px;
    }
    .field { margin-bottom: 10px; }
    .field-label { font-size: 11px; color: rgba(229,237,246,0.6); margin-bottom: 4px; }
    .field-row { display: flex; gap: 6px; align-items: center; }
    .field-input {
      flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 6px 10px; font-size: 12px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    .field-input:focus { border-color: rgba(42,227,255,0.5); }
    .field-input:read-only { color: rgba(255,255,255,0.5); }
    .btn-small {
      background: rgba(42,227,255,0.12); border: 1px solid rgba(42,227,255,0.25);
      color: #2AE3FF; padding: 6px 12px; font-size: 11px; cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-small:hover { background: rgba(42,227,255,0.25); }
    .hotkey-input {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #2AE3FF; padding: 6px 10px; font-size: 12px; font-family: monospace;
      outline: none; cursor: pointer; text-align: center; min-width: 120px;
    }
    .hotkey-input:focus { border-color: rgba(42,227,255,0.5); }
    .hint { font-size: 9px; color: rgba(255,255,255,0.3); margin-top: 3px; }
    .footer {
      padding: 10px 16px; display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn-save {
      background: rgba(42,227,255,0.2); border: 1px solid rgba(42,227,255,0.4);
      color: #fff; padding: 7px 20px; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-save:hover { background: rgba(42,227,255,0.35); }
    .btn-cancel {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6); padding: 7px 20px; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }
    .saved-msg {
      font-size: 11px; color: #2AE3FF; opacity: 0; transition: opacity 0.3s;
      align-self: center;
    }
    .saved-msg.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Settings</h2>
    <button class="close-x" id="close-x">&times;</button>
  </div>
  <div class="content">
    <div class="section">
      <div class="section-title">Save locations</div>
      <div class="field">
        <div class="field-label">Quick save folder (Ctrl+S)</div>
        <div class="field-row">
          <input type="text" class="field-input" id="quickSaveDir" readonly />
          <button class="btn-small" id="browseQuickSave">Browse</button>
        </div>
        <div class="hint">Where screenshots go when you press Ctrl+S</div>
      </div>
      <div class="field">
        <div class="field-label">Save As default folder (Ctrl+B)</div>
        <div class="field-row">
          <input type="text" class="field-input" id="lastSaveDir" readonly />
          <button class="btn-small" id="browseSaveAs">Browse</button>
        </div>
        <div class="hint">Starting folder for the Save As dialog</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Hotkey</div>
      <div class="field">
        <div class="field-label">Capture screenshot</div>
        <div class="field-row">
          <input type="text" class="hotkey-input" id="hotkey" readonly placeholder="Press a key..." />
          <button class="btn-small" id="resetHotkey">Reset</button>
        </div>
        <div class="hint">Click the box and press your preferred key combination</div>
      </div>
    </div>
  </div>
  <div class="footer">
    <span class="saved-msg" id="savedMsg">Settings saved</span>
    <button class="btn-cancel" id="cancelBtn">Cancel</button>
    <button class="btn-save" id="saveBtn">Save</button>
  </div>
</body>
</html>

<script>
  var settings = {};
  var hotkeyDisplay = { PrintScreen: 'Print Screen', 'Meta+Shift+KeyS': '⌘⇧S' };

  function invoke(cmd, args) {
    return window.__TAURI__.core.invoke(cmd, args);
  }

  function displayHotkey(key) {
    return hotkeyDisplay[key] || key;
  }

  // Load settings
  invoke('get_settings').then(function(s) {
    settings = s;
    document.getElementById('quickSaveDir').value = s.quickSaveDir || '';
    document.getElementById('lastSaveDir').value = s.lastSaveDir || '';
    document.getElementById('hotkey').value = displayHotkey(s.hotkey || 'PrintScreen');
  });

  // Browse buttons
  document.getElementById('browseQuickSave').addEventListener('click', function() {
    invoke('pick_folder').then(function(dir) {
      if (dir) {
        document.getElementById('quickSaveDir').value = dir;
        settings.quickSaveDir = dir;
      }
    });
  });

  document.getElementById('browseSaveAs').addEventListener('click', function() {
    invoke('pick_folder').then(function(dir) {
      if (dir) {
        document.getElementById('lastSaveDir').value = dir;
        settings.lastSaveDir = dir;
      }
    });
  });

  // Hotkey capture
  var hotkeyEl = document.getElementById('hotkey');
  hotkeyEl.addEventListener('click', function() {
    hotkeyEl.value = 'Press a key...';
    hotkeyEl.style.borderColor = 'rgba(42,227,255,0.8)';
    function onKey(e) {
      e.preventDefault();
      var parts = [];
      if (e.ctrlKey) parts.push('Ctrl');
      if (e.altKey) parts.push('Alt');
      if (e.shiftKey) parts.push('Shift');
      if (e.metaKey) parts.push('Meta');
      var key = e.code;
      if (!['ControlLeft','ControlRight','ShiftLeft','ShiftRight','AltLeft','AltRight','MetaLeft','MetaRight'].includes(key)) {
        parts.push(key);
        var combo = parts.join('+');
        hotkeyEl.value = combo;
        settings.hotkey = combo;
        hotkeyEl.style.borderColor = '';
        window.removeEventListener('keydown', onKey);
      }
    }
    window.addEventListener('keydown', onKey);
  });

  document.getElementById('resetHotkey').addEventListener('click', function() {
    var isMac = navigator.platform.indexOf('Mac') !== -1;
    var def = isMac ? 'Meta+Shift+KeyS' : 'PrintScreen';
    hotkeyEl.value = displayHotkey(def);
    settings.hotkey = def;
  });

  // Save
  document.getElementById('saveBtn').addEventListener('click', function() {
    if (settings.quickSaveDir) invoke('set_setting', { key: 'quickSaveDir', value: settings.quickSaveDir });
    if (settings.lastSaveDir) invoke('set_setting', { key: 'lastSaveDir', value: settings.lastSaveDir });
    if (settings.hotkey) invoke('set_setting', { key: 'hotkey', value: settings.hotkey });
    var msg = document.getElementById('savedMsg');
    msg.classList.add('show');
    setTimeout(function() { msg.classList.remove('show'); }, 2000);
  });

  // Cancel / Close
  document.getElementById('cancelBtn').addEventListener('click', function() {
    invoke('close_settings');
  });
  document.getElementById('close-x').addEventListener('click', function() {
    invoke('close_settings');
  });

  // macOS hints
  if (navigator.platform.indexOf('Mac') !== -1) {
    document.querySelector('.hint').textContent = 'Where screenshots go when you press ⌘S';
    document.querySelectorAll('.field-label')[1].textContent = 'Save As default folder (⌘B)';
  }
</script>
