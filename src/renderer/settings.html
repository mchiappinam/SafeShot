<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeShot Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #020A51 0%, #2322F0 60%, #9F38FA 100%);
      color: #fff; height: 100vh;
      display: flex; flex-direction: column;
      user-select: none; overflow: hidden;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 8px;
      -webkit-app-region: drag; cursor: move;
    }
    .header h2 {
      font-size: 16px; font-weight: 700;
      background: linear-gradient(90deg, #fff, #2AE3FF);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .close-x {
      background: none; border: none; color: rgba(255,255,255,0.3);
      font-size: 18px; cursor: pointer; transition: color 0.15s;
      -webkit-app-region: no-drag;
    }
    .close-x:hover { color: #fff; }
    .content { flex: 1; padding: 0 16px 16px; }
    .section { margin-bottom: 16px; }
    .section-title {
      font-size: 10px; color: rgba(42,227,255,0.7); text-transform: uppercase;
      letter-spacing: 1.5px; margin-bottom: 8px;
    }
    .field { margin-bottom: 10px; }
    .field-label { font-size: 11px; color: rgba(229,237,246,0.6); margin-bottom: 4px; }
    .field-row { display: flex; gap: 6px; align-items: center; }
    .field-input {
      flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 6px 10px; font-size: 12px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    .field-input:read-only { color: rgba(255,255,255,0.5); }
    .btn-small {
      background: rgba(42,227,255,0.12); border: 1px solid rgba(42,227,255,0.25);
      color: #2AE3FF; padding: 6px 12px; font-size: 11px; cursor: pointer;
      transition: all 0.15s; white-space: nowrap; min-width: 70px; text-align: center;
    }
    .btn-small:hover { background: rgba(42,227,255,0.25); }
    .hotkey-input {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #2AE3FF; padding: 6px 10px; font-size: 12px; font-family: monospace;
      outline: none; cursor: pointer; text-align: center; min-width: 200px; flex: 1;
    }
    .hint { font-size: 9px; color: rgba(255,255,255,0.3); margin-top: 3px; }
    .error-msg { font-size: 9px; color: #FF4488; margin-top: 3px; display: none; }
    .footer {
      padding: 10px 16px 14px; display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn-save {
      background: rgba(42,227,255,0.2); border: 1px solid rgba(42,227,255,0.4);
      color: #fff; padding: 7px 20px; font-size: 12px; cursor: pointer; transition: all 0.15s;
    }
    .btn-save:hover { background: rgba(42,227,255,0.35); }
    .btn-cancel {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6); padding: 7px 20px; font-size: 12px; cursor: pointer; transition: all 0.15s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="header">
    <h2>Settings</h2>
    <button class="close-x" id="close-x">&times;</button>
  </div>
  <div class="content">
    <div class="section">
      <div class="section-title">Save locations</div>
      <div class="field">
        <div class="field-label" id="lbl-quick">Quick save folder (Ctrl+S)</div>
        <div class="field-row">
          <input type="text" class="field-input" id="quickSaveDir" readonly />
          <button class="btn-small" id="browseQuickSave">Browse</button>
        </div>
        <div class="hint" id="hint-quick">Where screenshots go when you press Ctrl+S</div>
      </div>
      <div class="field">
        <div class="field-label" id="lbl-saveas">Save As default folder (Ctrl+B)</div>
        <div class="field-row">
          <input type="text" class="field-input" id="lastSaveDir" readonly />
          <button class="btn-small" id="browseSaveAs">Browse</button>
        </div>
        <div class="hint">Starting folder for the Save As dialog</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Hotkey</div>
      <div class="field">
        <div class="field-label">Capture screenshot</div>
        <div class="field-row">
          <input type="text" class="hotkey-input" id="hotkey" readonly />
          <button class="btn-small" id="resetHotkey">Reset</button>
        </div>
        <div class="hint" id="hint-hotkey">Click the box and press your preferred key combination</div>
        <div class="error-msg" id="hotkeyError"></div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Capture</div>
      <div class="field">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="captureCursor" style="accent-color: #2AE3FF; width: 16px; height: 16px;" />
          <span class="field-label" style="margin: 0;">Include mouse cursor in screenshots</span>
        </label>
      </div>
      <div class="field">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="showNotifications" style="accent-color: #2AE3FF; width: 16px; height: 16px;" />
          <span class="field-label" style="margin: 0;">Show notifications after save/copy</span>
        </label>
      </div>
    </div>
  </div>
  <div class="footer">
    <button class="btn-cancel" id="cancelBtn">Cancel</button>
    <button class="btn-save" id="saveBtn">Save</button>
  </div>
  <script>
  var settings = {};
  var originalHotkey = '';
  var hotkeyDisplay = { PrintScreen: 'Print Screen', 'Meta+Shift+KeyS': '\u2318\u21E7S' };
  var reservedKeys = [
    'Ctrl+KeyZ', 'Ctrl+KeyY', 'Ctrl+KeyS', 'Ctrl+KeyB', 'Ctrl+KeyC', 'Ctrl+KeyA',
    'Meta+KeyZ', 'Meta+KeyY', 'Meta+KeyS', 'Meta+KeyB', 'Meta+KeyC', 'Meta+KeyA',
    'Ctrl+Shift+KeyZ', 'Meta+Shift+KeyZ', 'Escape',
  ];
  var listening = false;
  var onHotkeyKey = null;

  function invoke(cmd, args) { return window.__TAURI__.core.invoke(cmd, args); }
  function displayHotkey(key) {
    if (hotkeyDisplay[key]) return hotkeyDisplay[key];
    var display = key;
    // Strip Key/Digit prefixes from codes for readability
    display = display.replace(/Key([A-Z])/g, '$1');
    display = display.replace(/Digit([0-9])/g, '$1');
    // Convert modifier names to symbols on macOS
    if (navigator.platform.indexOf('Mac') !== -1) {
      display = display.replace('Meta+', '\u2318').replace('Shift+', '\u21E7').replace('Ctrl+', '\u2303').replace('Alt+', '\u2325');
    }
    return display;
  }

  function stopListening() {
    if (!listening) return;
    listening = false;
    document.getElementById('hotkey').style.borderColor = '';
    if (onHotkeyKey) window.removeEventListener('keydown', onHotkeyKey);
    onHotkeyKey = null;
    invoke('resume_hotkey');
  }

  invoke('get_settings').then(function(s) {
    settings = s;
    originalHotkey = s.hotkey || 'PrintScreen';
    document.getElementById('quickSaveDir').value = s.quickSaveDir || '';
    document.getElementById('lastSaveDir').value = s.lastSaveDir || '';
    document.getElementById('hotkey').value = displayHotkey(originalHotkey);
    document.getElementById('captureCursor').checked = s.captureCursor || false;
    document.getElementById('showNotifications').checked = s.showNotifications !== false;
  });

  document.getElementById('browseQuickSave').addEventListener('click', function() {
    invoke('pick_folder').then(function(dir) {
      if (dir) { document.getElementById('quickSaveDir').value = dir; settings.quickSaveDir = dir; }
    });
  });
  document.getElementById('browseSaveAs').addEventListener('click', function() {
    invoke('pick_folder').then(function(dir) {
      if (dir) { document.getElementById('lastSaveDir').value = dir; settings.lastSaveDir = dir; }
    });
  });

  var hotkeyEl = document.getElementById('hotkey');
  var errorEl = document.getElementById('hotkeyError');

  hotkeyEl.addEventListener('click', function() {
    if (listening) return;
    listening = true;
    hotkeyEl.value = 'Listening... (ESC cancel)';
    hotkeyEl.style.borderColor = 'rgba(42,227,255,0.8)';
    errorEl.style.display = 'none';
    invoke('pause_hotkey');

    onHotkeyKey = function(e) {
      e.preventDefault();
      if (e.key === 'Escape') {
        hotkeyEl.value = displayHotkey(settings.hotkey || originalHotkey);
        errorEl.style.display = 'none';
        stopListening();
        return;
      }
      var mods = [];
      if (e.ctrlKey) mods.push('Ctrl');
      if (e.altKey) mods.push('Alt');
      if (e.shiftKey) mods.push('Shift');
      if (e.metaKey) mods.push('Meta');
      var key = e.code;
      if (['ControlLeft','ControlRight','ShiftLeft','ShiftRight','AltLeft','AltRight','MetaLeft','MetaRight'].includes(key)) return;
      mods.push(key);
      var combo = mods.join('+');
      if (reservedKeys.includes(combo)) {
        errorEl.textContent = 'That shortcut is reserved by SafeShot';
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';
      hotkeyEl.value = displayHotkey(combo);
      settings.hotkey = combo;
      stopListening();
    };
    window.addEventListener('keydown', onHotkeyKey);
  });

  document.addEventListener('click', function(e) {
    if (listening && e.target !== hotkeyEl) {
      hotkeyEl.value = displayHotkey(settings.hotkey || originalHotkey);
      errorEl.style.display = 'none';
      stopListening();
    }
  });

  document.getElementById('resetHotkey').addEventListener('click', function() {
    var isMac = navigator.platform.indexOf('Mac') !== -1;
    var def = isMac ? 'Meta+Shift+KeyS' : 'PrintScreen';
    hotkeyEl.value = displayHotkey(def);
    settings.hotkey = def;
    errorEl.style.display = 'none';
    stopListening();
  });

  document.getElementById('saveBtn').addEventListener('click', function() {
    if (settings.quickSaveDir) invoke('set_setting', { key: 'quickSaveDir', value: settings.quickSaveDir });
    if (settings.lastSaveDir) invoke('set_setting', { key: 'lastSaveDir', value: settings.lastSaveDir });
    invoke('set_setting', { key: 'captureCursor', value: document.getElementById('captureCursor').checked ? 'true' : 'false' });
    invoke('set_setting', { key: 'showNotifications', value: document.getElementById('showNotifications').checked ? 'true' : 'false' });
    if (settings.hotkey) {
      invoke('set_setting', { key: 'hotkey', value: settings.hotkey });
      invoke('register_hotkey', { hotkey: settings.hotkey }).then(function() {
        invoke('close_settings');
      }).catch(function(err) {
        errorEl.textContent = 'Failed to register hotkey: ' + err;
        errorEl.style.display = 'block';
      });
    } else {
      invoke('close_settings');
    }
  });

  document.getElementById('cancelBtn').addEventListener('click', function() { stopListening(); invoke('close_settings'); });
  document.getElementById('close-x').addEventListener('click', function() { stopListening(); invoke('close_settings'); });

  if (navigator.platform.indexOf('Mac') !== -1) {
    document.getElementById('lbl-quick').textContent = 'Quick save folder (\u2318S)';
    document.getElementById('hint-quick').textContent = 'Where screenshots go when you press \u2318S';
    document.getElementById('lbl-saveas').textContent = 'Save As default folder (\u2318B)';
  }
  </script>
</body>
</html>
