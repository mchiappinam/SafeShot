<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>About SafeShot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #020A51 0%, #2322F0 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(42,227,255,0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(159,56,250,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .container {
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 32px;
    }
    .logo { font-size: 56px; margin-bottom: 12px; filter: drop-shadow(0 4px 12px rgba(42,227,255,0.3)); }
    h1 {
      font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 4px;
      background: linear-gradient(90deg, #fff, #2AE3FF);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .version { font-size: 12px; color: rgba(179,195,218,0.7); font-family: monospace; letter-spacing: 1px; margin: 0 0 20px; }
    .divider { width: 60px; height: 2px; background: linear-gradient(90deg, #2AE3FF, #9F38FA); margin: 0 auto 20px; }
    .mission { font-size: 14px; line-height: 1.7; color: rgba(229,237,246,0.85); margin: 0 0 24px; max-width: 360px; }
    .features { display: flex; justify-content: center; gap: 24px; margin: 0 0 24px; }
    .feature { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .feature-icon {
      font-size: 20px; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(42,227,255,0.1); border: 1px solid rgba(42,227,255,0.2);
    }
    .feature-label { font-size: 10px; color: rgba(179,195,218,0.7); text-transform: uppercase; letter-spacing: 1px; }
    .credit { font-size: 12px; color: rgba(179,195,218,0.6); }
    .credit a { color: #2AE3FF; text-decoration: none; }
    .credit a:hover { color: #ECBA58; }
    .url { font-size: 11px; color: rgba(179,195,218,0.4); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🛡️</div>
    <h1>SafeShot</h1>
    <p class="version" id="version">v1.0.0</p>
    <div class="divider"></div>
    <p class="mission">
      Privacy-first screenshot tool. Your screenshots stay yours, always.
      No cloud, no tracking, no compromises.
    </p>
    <div class="features">
      <div class="feature"><div class="feature-icon">🔒</div><span class="feature-label">Private</span></div>
      <div class="feature"><div class="feature-icon">⚡</div><span class="feature-label">Fast</span></div>
      <div class="feature"><div class="feature-icon">🎨</div><span class="feature-label">Annotate</span></div>
      <div class="feature"><div class="feature-icon">💻</div><span class="feature-label">Local</span></div>
    </div>
    <p class="credit">Developed by <a href="https://chiappina.com" target="_blank">Matheus Chiappina</a></p>
    <p class="url">chiappina.com</p>
  </div>
  <script>
    // Get version from Tauri
    if (window.__TAURI__) {
      window.__TAURI__.core.invoke('get_next_filename').then(() => {}).catch(() => {});
    }
    // Version is baked into the HTML at build time via Tauri, but we can read it from the title bar
    // For now, just display a static version that matches the build
  </script>
</body>
</html>
