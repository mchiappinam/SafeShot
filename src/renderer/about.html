<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>About SafeShot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #020A51 0%, #2322F0 60%, #9F38FA 100%);
      color: #fff; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      user-select: none; overflow: hidden;
    }
    .logo { font-size: 44px; margin-bottom: 14px; filter: drop-shadow(0 2px 8px rgba(42,227,255,0.4)); }
    h1 {
      font-size: 24px; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(90deg, #fff, #2AE3FF);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .version { font-size: 11px; color: rgba(179,195,218,0.5); font-family: monospace; letter-spacing: 1px; margin-bottom: 20px; }
    .divider { width: 50px; height: 2px; background: linear-gradient(90deg, #2AE3FF, #9F38FA); margin-bottom: 20px; }
    .mission { font-size: 13px; line-height: 1.7; color: rgba(229,237,246,0.6); margin-bottom: 24px; max-width: 320px; text-align: center; }
    .features { display: flex; gap: 20px; margin-bottom: 24px; }
    .feature { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .feature-icon {
      font-size: 18px; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(42,227,255,0.12); border: 1px solid rgba(42,227,255,0.25);
    }
    .feature-label { font-size: 10px; color: rgba(179,195,218,0.5); text-transform: uppercase; letter-spacing: 1px; }
    .credit { font-size: 10px; color: rgba(179,195,218,0.3); }
    .credit a { color: rgba(42,227,255,0.5); text-decoration: none; cursor: pointer; }
    .close-x {
      position: fixed; top: 8px; right: 12px;
      background: none; border: none; color: rgba(255,255,255,0.3);
      font-size: 18px; cursor: pointer; transition: color 0.15s;
    }
    .close-x:hover { color: #fff; }
  </style>
</head>
<body>
  <button class="close-x" id="close-x">&times;</button>
  <div class="logo">🛡️</div>
  <h1>SafeShot</h1>
  <p class="version" id="version"></p>
  <div class="divider"></div>
  <p class="mission">Privacy-first screenshot tool.<br>No cloud. No tracking. No compromises.</p>
  <div class="features">
    <div class="feature"><div class="feature-icon">🔒</div><span class="feature-label">Private</span></div>
    <div class="feature"><div class="feature-icon">⚡</div><span class="feature-label">Fast</span></div>
    <div class="feature"><div class="feature-icon">🎨</div><span class="feature-label">Annotate</span></div>
    <div class="feature"><div class="feature-icon">💻</div><span class="feature-label">Local</span></div>
  </div>
  <p class="credit">by <a id="dev-link">chiappina.com</a></p>
  <script>
    document.getElementById('close-x').addEventListener('click', function() {
      if (window.__TAURI__) {
        window.__TAURI__.core.invoke('close_about').catch(function() {});
      }
    });
    document.getElementById('dev-link').addEventListener('click', function() {
      if (window.__TAURI__) {
        window.__TAURI__.core.invoke('open_url', { url: 'https://chiappina.com' }).catch(function() {});
      }
    });
  </script>
</body>
</html>
