<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>About SafeShot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #020A51 0%, #2322F0 60%, #9F38FA 100%);
      color: #fff; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      user-select: none; overflow: hidden;
    }
    .logo { width: 56px; height: 56px; margin-bottom: 12px; filter: drop-shadow(0 2px 8px rgba(42,227,255,0.4)); cursor: pointer; -webkit-user-drag: none; }
    h1 {
      font-size: 24px; font-weight: 800; margin-bottom: 4px;
      background: linear-gradient(90deg, #fff, #2AE3FF);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .divider { width: 50px; height: 2px; background: linear-gradient(90deg, #2AE3FF, #9F38FA); margin: 12px 0 16px; }
    .mission { font-size: 13px; line-height: 1.7; color: rgba(229,237,246,0.6); margin-bottom: 20px; max-width: 320px; text-align: center; }
    .features { display: flex; gap: 16px; margin-bottom: 20px; }
    .feature { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .feature-icon {
      font-size: 16px; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(42,227,255,0.12); border: 1px solid rgba(42,227,255,0.25);
    }
    .feature-label { font-size: 9px; color: rgba(179,195,218,0.5); text-transform: uppercase; letter-spacing: 1px; }
    .tagline { font-size: 11px; color: rgba(229,237,246,0.4); margin-bottom: 16px; }
    .credit { font-size: 10px; color: rgba(255,255,255,0.65); }
    .credit a { color: #2AE3FF; text-decoration: none; cursor: pointer; }
    .heart { color: #FF4488; animation: pulse 1.2s ease-in-out infinite; display: inline-block; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    .close-x {
      position: fixed; top: 8px; right: 12px;
      background: none; border: none; color: rgba(255,255,255,0.3);
      font-size: 18px; cursor: pointer; transition: color 0.15s;
    }
    .close-x:hover { color: #fff; }
    .version-link { font-size: 9px !important; color: rgba(255,255,255,0.4); margin-top: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <button class="close-x" id="close-x">&times;</button>
  <img class="logo" id="logo" src="./logo.png" alt="SafeShot" draggable="false" />
  <h1>SafeShot</h1>
  <div class="divider"></div>
  <p class="mission">Privacy-first screenshot tool for Windows and macOS.<br>Your screenshots stay yours, always.</p>
  <div class="features">
    <div class="feature"><div class="feature-icon">🔒</div><span class="feature-label">Private</span></div>
    <div class="feature"><div class="feature-icon">⚡</div><span class="feature-label">Fast</span></div>
    <div class="feature"><div class="feature-icon">🎨</div><span class="feature-label">Annotate</span></div>
    <div class="feature"><div class="feature-icon">💻</div><span class="feature-label">Local</span></div>
    <div class="feature"><div class="feature-icon">🌐</div><span class="feature-label">Offline</span></div>
  </div>
  <p class="tagline">No cloud. No tracking. No compromises.</p>
  <p class="credit">Made with <span class="heart">&#10084;</span> by <a id="dev-link">Matheus Chiappina</a></p>
  <p class="version-link" id="version-link">SafeShot v1.1.53</p>
  <script>
    document.getElementById('close-x').addEventListener('click', function() {
      if (window.__TAURI__) window.__TAURI__.core.invoke('close_about');
    });
    document.getElementById('logo').addEventListener('click', function() {
      if (window.__TAURI__) window.__TAURI__.core.invoke('open_url', { url: 'https://github.com/mchiappinam/SafeShot' });
    });
    document.getElementById('version-link').addEventListener('click', function() {
      if (window.__TAURI__) window.__TAURI__.core.invoke('open_url', { url: 'https://github.com/mchiappinam/SafeShot' });
    });
    document.getElementById('dev-link').addEventListener('click', function() {
      if (window.__TAURI__) window.__TAURI__.core.invoke('open_url', { url: 'https://chiappina.com' });
    });
  </script>
</body>
</html>
