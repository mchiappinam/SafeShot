<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome to SafeShot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #020A51, #2322F0);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      user-select: none;
    }
    .logo { font-size: 36px; margin-bottom: 8px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .tip { font-size: 13px; color: rgba(229,237,246,0.85); line-height: 1.7; margin-bottom: 20px; }
    .kbd {
      display: inline-block;
      background: rgba(42,227,255,0.15);
      border: 1px solid rgba(42,227,255,0.3);
      padding: 2px 8px;
      font-family: monospace;
      font-size: 12px;
      color: #2AE3FF;
    }
    .close-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 24px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .close-btn:hover { background: rgba(255,255,255,0.2); }
    .timer { font-size: 11px; color: rgba(179,195,218,0.5); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="logo">🛡️</div>
  <h1>Welcome to SafeShot!</h1>
  <p class="tip">
    Press <span class="kbd">Print Screen</span> to capture your screen<br>
    or click the <strong>SafeShot tray icon</strong> near the clock.<br><br>
    After selecting an area:<br>
    <span class="kbd">Ctrl+C</span> copy &nbsp;
    <span class="kbd">Ctrl+S</span> save &nbsp;
    <span class="kbd">ESC</span> cancel
  </p>
  <button class="close-btn" id="close-btn">Got it</button>
  <p class="timer" id="timer">Closing in 10s</p>
  <p style="font-size:10px; color:rgba(179,195,218,0.4); margin-top:10px;">
    Developed by <a href="https://chiappina.com" target="_blank" style="color:#2AE3FF; text-decoration:none;">Matheus Chiappina</a>
    &nbsp;|&nbsp; chiappina.com
  </p>
  <script src="./welcome.js"></script>
</body>
</html>
