name: Build SafeShot

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: [self-hosted, Windows]
    if: "!contains(github.ref, '-mac')"
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          rustc --version
          node --version
          call npm install
          call node scripts/generate-icons.js
          call npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-macos-arm:
    name: macOS (Apple Silicon)
    runs-on: [self-hosted, macOS]
    if: "!contains(github.ref, '-beta') || contains(github.ref, '-mac-arm') || (contains(github.ref, '-mac') && !contains(github.ref, '-mac-x64')) || contains(github.ref, '-all')"
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustc --version
          node --version
          npm install
          node scripts/generate-icons.js
          npx tauri build --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos-arm
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-macos-x64:
    name: macOS (Intel)
    runs-on: [self-hosted, macOS]
    if: "!contains(github.ref, '-beta') || contains(github.ref, '-mac-x64') || (contains(github.ref, '-mac') && !contains(github.ref, '-mac-arm')) || contains(github.ref, '-all')"
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustc --version
          node --version
          npm install
          node scripts/generate-icons.js
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos-x64
          path: src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Release
    needs: [build-windows, build-macos-arm, build-macos-x64]
    if: "always() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
