name: Build SafeShot

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-config:
    name: Read Runner Config
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.cfg.outputs.windows }}
      macos_arm: ${{ steps.cfg.outputs.macos_arm }}
      macos_x64: ${{ steps.cfg.outputs.macos_x64 }}
      linux: ${{ steps.cfg.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "windows=$(jq -c '.windows' .github/runner-config.json)" >> $GITHUB_OUTPUT
          echo "macos_arm=$(jq -c '.["macos-arm"]' .github/runner-config.json)" >> $GITHUB_OUTPUT
          echo "macos_x64=$(jq -c '.["macos-x64"]' .github/runner-config.json)" >> $GITHUB_OUTPUT
          echo "linux=$(jq -c '.linux' .github/runner-config.json)" >> $GITHUB_OUTPUT

  build-windows:
    name: Windows
    needs: read-config
    runs-on: ${{ fromJSON(needs.read-config.outputs.windows) }}
    if: "!contains(github.ref, '-mac') && !contains(github.ref, '-linux')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.windows, 'self-hosted')"
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.windows, 'self-hosted')"
      - name: Build
        shell: cmd
        run: |
          call npm install
          call node scripts/generate-icons.js
          call npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-macos-arm:
    name: macOS (Apple Silicon)
    needs: read-config
    runs-on: ${{ fromJSON(needs.read-config.outputs.macos_arm) }}
    if: "!contains(github.ref, '-beta-win') && !contains(github.ref, '-beta-mac-x64') && !contains(github.ref, '-linux')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.macos_arm, 'self-hosted')"
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.macos_arm, 'self-hosted')"
        with:
          targets: aarch64-apple-darwin
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos-arm
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-macos-x64:
    name: macOS (Intel)
    needs: read-config
    runs-on: ${{ fromJSON(needs.read-config.outputs.macos_x64) }}
    if: "!contains(github.ref, '-beta-win') && !contains(github.ref, '-beta-mac-arm') && !contains(github.ref, '-linux')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.macos_x64, 'self-hosted')"
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.macos_x64, 'self-hosted')"
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos-x64
          path: src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    name: Linux
    needs: read-config
    runs-on: ${{ fromJSON(needs.read-config.outputs.linux) }}
    if: "!contains(github.ref, '-win') && !contains(github.ref, '-mac')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.linux, 'self-hosted')"
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.linux, 'self-hosted')"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Build
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    name: Release
    needs: [build-windows, build-macos-arm, build-macos-x64, build-linux]
    if: "always() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release
          find artifacts -name '*x64-setup.exe' -exec cp {} "release/SafeShot-${VERSION}-Windows-x64.exe" \;
          find artifacts -name '*aarch64.dmg' -exec cp {} "release/SafeShot-${VERSION}-macOS-AppleSilicon-aarch64.dmg" \;
          find artifacts -name '*x64.dmg' -exec cp {} "release/SafeShot-${VERSION}-macOS-Intel-x64.dmg" \;
          find artifacts -name '*amd64.deb' -exec cp {} "release/SafeShot-${VERSION}-Linux-amd64.deb" \;
          find artifacts -name '*amd64.AppImage' -exec cp {} "release/SafeShot-${VERSION}-Linux-amd64.AppImage" \;
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  update-winget:
    name: Update winget
    needs: release
    if: "needs.release.result == 'success'"
    runs-on: windows-latest
    steps:
      - name: Submit to winget
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $url = "https://github.com/mchiappinam/SafeShot/releases/download/${{ github.ref_name }}/SafeShot-${version}-Windows-x64.exe"
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Chiappina.SafeShot -s -v $version -u $url --token ${{ secrets.RELEASE_TOKEN }}

  update-brew:
    name: Update Homebrew cask
    needs: release
    if: "needs.release.result == 'success'"
    runs-on: ubuntu-latest
    steps:
      - name: Update cask
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO="mchiappinam/SafeShot"
          INTEL_URL="https://github.com/$REPO/releases/download/v${VERSION}/SafeShot-${VERSION}-macOS-Intel-x64.dmg"
          ARM_URL="https://github.com/$REPO/releases/download/v${VERSION}/SafeShot-${VERSION}-macOS-AppleSilicon-aarch64.dmg"
          INTEL_SHA=$(curl -sL "$INTEL_URL" | sha256sum | awk '{print $1}')
          ARM_SHA=$(curl -sL "$ARM_URL" | sha256sum | awk '{print $1}')
          git clone https://x-access-token:${GH_TOKEN}@github.com/mchiappinam/homebrew-safeshot.git
          cd homebrew-safeshot
          cat > Casks/safeshot.rb << EOF
          cask "safeshot" do
            version "$VERSION"

            on_intel do
              url "https://github.com/$REPO/releases/download/v#{version}/SafeShot-#{version}-macOS-Intel-x64.dmg"
              sha256 "$INTEL_SHA"
            end

            on_arm do
              url "https://github.com/$REPO/releases/download/v#{version}/SafeShot-#{version}-macOS-AppleSilicon-aarch64.dmg"
              sha256 "$ARM_SHA"
            end

            name "SafeShot"
            desc "Privacy-first screenshot tool. No cloud, no tracking."
            homepage "https://github.com/$REPO"

            app "SafeShot.app"

            zap trash: [
              "~/Library/Application Support/SafeShot",
              "~/Library/LaunchAgents/com.chiappina.safeshot.plist",
            ]
          end
          EOF
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "v${VERSION}"
          git push
