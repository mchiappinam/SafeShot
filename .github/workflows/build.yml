name: Build SafeShot

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-config:
    name: Read Runner Config
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.cfg.outputs.windows }}
      macos-arm: ${{ steps.cfg.outputs.macos-arm }}
      macos-x64: ${{ steps.cfg.outputs.macos-x64 }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          echo "windows=$(jq -r '.windows' .github/runner-config.json)" >> $GITHUB_OUTPUT
          echo "macos-arm=$(jq -r '.["macos-arm"]' .github/runner-config.json)" >> $GITHUB_OUTPUT
          echo "macos-x64=$(jq -r '.["macos-x64"]' .github/runner-config.json)" >> $GITHUB_OUTPUT

  build-windows:
    name: Windows
    needs: read-config
    runs-on: ${{ needs.read-config.outputs.windows }}
    if: "!contains(github.ref, '-mac')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.windows, 'self-hosted')"
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.windows, 'self-hosted')"

      - name: Build
        shell: cmd
        run: |
          call npm install
          call node scripts/generate-icons.js
          call npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-macos-arm:
    name: macOS (Apple Silicon)
    needs: read-config
    runs-on: ${{ needs.read-config.outputs.macos-arm }}
    if: "!contains(github.ref, '-beta-win') && !contains(github.ref, '-beta-mac-x64')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.macos-arm, 'self-hosted')"
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.macos-arm, 'self-hosted')"
        with:
          targets: aarch64-apple-darwin

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos-arm
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-macos-x64:
    name: macOS (Intel)
    needs: read-config
    runs-on: ${{ needs.read-config.outputs.macos-x64 }}
    if: "!contains(github.ref, '-beta-win') && !contains(github.ref, '-beta-mac-arm')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.macos-x64, 'self-hosted')"
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.macos-x64, 'self-hosted')"

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos-x64
          path: src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Release
    needs: [build-windows, build-macos-arm, build-macos-x64]
    if: "always() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true

  build-windows:
    name: Windows
    needs: read-config
    runs-on: ${{ fromJSON(needs.read-config.outputs.windows) }}
    if: "!contains(github.ref, '-mac') && !contains(github.ref, '-linux')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.windows, 'self-hosted')"
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.windows, 'self-hosted')"

      - name: Build
        shell: cmd
        run: |
          call npm install
          call node scripts/generate-icons.js
          call npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos-arm:
    name: macOS (Apple Silicon)
    needs: read-config
    runs-on: ${{ fromJSON(needs.read-config.outputs.macos-arm) }}
    if: "!contains(github.ref, '-beta-win') && !contains(github.ref, '-beta-mac-x64') && !contains(github.ref, '-linux')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.macos-arm, 'self-hosted')"
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.macos-arm, 'self-hosted')"
        with:
          targets: aarch64-apple-darwin

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos-arm
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-macos-x64:
    name: macOS (Intel)
    needs: read-config
    runs-on: ${{ fromJSON(needs.read-config.outputs.macos-x64) }}
    if: "!contains(github.ref, '-beta-win') && !contains(github.ref, '-beta-mac-arm') && !contains(github.ref, '-linux')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.macos-x64, 'self-hosted')"
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.macos-x64, 'self-hosted')"

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos-x64
          path: src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    name: Linux
    needs: read-config
    runs-on: ${{ fromJSON(needs.read-config.outputs.linux) }}
    if: "!contains(github.ref, '-win') && !contains(github.ref, '-mac')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: "!contains(needs.read-config.outputs.linux, 'self-hosted')"
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: "!contains(needs.read-config.outputs.linux, 'self-hosted')"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Build
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    name: Release
    needs: [build-windows, build-macos-arm, build-macos-x64, build-linux]
    if: "always() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          generate_release_notes: true
