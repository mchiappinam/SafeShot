name: Build SafeShot

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: self-hosted
    if: "!contains(github.ref, '-mac')"
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          rustc --version
          node --version
          call npm install
          call node scripts/generate-icons.js
          call npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    name: macOS
    runs-on: macos-latest
    if: "!contains(github.ref, '-beta') || contains(github.ref, '-mac') || contains(github.ref, '-all')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          npm install
          node scripts/generate-icons.js
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Release
    needs: [build-windows, build-macos]
    if: "always() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
