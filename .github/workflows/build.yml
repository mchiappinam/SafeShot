name: Build SafeShot

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          rustc --version
          node --version
          call npm install
          call node scripts/generate-icons.js
          call npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SafeShot-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # build-macos:
  #   name: macOS
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v4
